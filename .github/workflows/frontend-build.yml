name: Frontend Build

on:
  push:
    paths:
      - "frontend/**"
      - "package.json"
      - "vercel.json"
  pull_request:
    paths:
      - "frontend/**"
      - "package.json"
      - "vercel.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm --prefix frontend install
      - run: npm --prefix frontend run build
