name: Signal Snapshot

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-snapshot
  cancel-in-progress: true

jobs:
  generate-dashboard-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Try generating dashboard snapshot
        env:
          WATCHLIST: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,AVAXUSDT
        continue-on-error: true
        run: python scripts/generate_dashboard_data.py

      - name: Ensure dashboard snapshot exists
        run: python scripts/ensure_dashboard_snapshot.py

      - name: Upload dashboard snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-snapshot
          path: frontend/public/data/dashboard.json
          if-no-files-found: error
